services:
  - type: web
    name: phantom-operator
    runtime: node
    plan: free
    buildCommand: npm install --omit=optional
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.19.2"
      - key: NODE_ENV
        value: production
      - key: PAY_TO
        value: "0x3d95D4A6DbaE0Cd0643a82b13A13b08921D6ADf7"
      - key: RATE_LIMIT_PUBLIC
        value: "60"
      - key: RATE_LIMIT_PAID
        value: "10"
