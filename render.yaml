services:
  - type: web
    name: phantom-operator
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: PAY_TO
        value: "0xC5f20C3Ad7B730B34620ecF39c2C5681482A6Cd6"
      - key: RATE_LIMIT_PUBLIC
        value: "60"
      - key: RATE_LIMIT_PAID
        value: "10"
